[package]
name = "tracelamp"
version = "0.1.0"
edition = "2021"
description = "TraceLamp scans repositories for security risks, API efficiency, and agent-data interactions"
license = "Apache-2.0"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tracelamp"
path = "src/main.rs"

# Installed alongside `tracelamp` so existing scripts that call `recon` keep working.
[[bin]]
name = "recon"
path = "src/bin/recon.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File traversal. The scanner walks with `ignore` so .gitignore applies.
# walkdir stays for the AzGuard regression test.
walkdir = "2"
ignore = "=0.4.23"

# Pattern matching
regex = "1"

# HTTP client. rustls avoids a libssl-dev / native-tls dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Code parsing (tree-sitter). Grammars are loaded for Python, JS/TS, Go, and Rust.
# Other languages stay on the regex fallback.
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"

# Colored terminal output
colored = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Directory paths
dirs = "5"

# Async trait support
async-trait = "0.1"

# UUID for report IDs
uuid = { version = "1", features = ["v4"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Future streaming
futures = "0.3"

# Stable finding fingerprints for baseline files
sha2 = "0.10"

# MCP server and client. Scan does not start this.
# `reqwest` here is rmcp's rustls feature, not native-tls.
rmcp = { version = "3.8.0", features = [
    "server",
    "transport-io",
    "client",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1"

# Streamable HTTP MCP server. `mcp serve --transport http` binds 127.0.0.1:$PORT.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"

[dev-dependencies]
insta = { version = "=1.40.0", features = ["json"] }
tempfile = "3"
